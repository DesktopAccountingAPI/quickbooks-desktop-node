# Toolchain and tasks. `mise run check` is what CI runs.
[tools]
node = "24.20.0"

[tasks.check]
description = "Install, typecheck, build, unit tests, conformance suite, examples, README samples, package smoke tests and package contents"
run = [
  "npm ci --no-audit --no-fund",
  "npm run typecheck",
  "npm run build",
  "npm test",
  "npm run test:conformance",
  "npm run typecheck:examples",
  "npm run test:readme",
  "npm run smoke",
  "npm run pack:check",
  "bash scripts/publish.sh --dry-run --skip-check",
]

[tasks."test:node"]
description = "After `mise run check`: compiled unit and conformance tests plus the package smoke test on another Node.js version (NODE_TEST_VERSION, default 20)"
run = [
  'mise exec node@{{ get_env(name="NODE_TEST_VERSION", default="20") }} -- node scripts/test-dist.mjs',
  'mise exec node@{{ get_env(name="NODE_TEST_VERSION", default="20") }} -- node scripts/smoke.mjs',
]

[tasks.publish]
description = "Publish to npm (CI release workflow). Add --dry-run to only build and pack."
run = "bash scripts/publish.sh"
